version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_web
    restart: always
    # Lệnh thông minh giải quyết bài toán con gà quả trứng
    command: sh -c "if [ ! -f manage.py ]; then django-admin startproject core .; fi && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Đồng bộ code từ ngoài VS Code vào thư mục /app trong Docker
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    container_name: crm_celery
    restart: always
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
      
